defaults:
  - sdpo
  - _self_

vars:
  dir: /leonardo_work/AIFAC_F02_352/anna/SDPO_acsl_rl
  log_dir: ${vars.dir}/output_logs
  ckpt_dir: ${vars.dir}/checkpoints

max_model_len: 8192

data:
  max_prompt_length: 2560
  max_response_length: 2048
  train_batch_size: 16
  seed: 42

actor_rollout_ref:
  model:
    path: /leonardo_work/AIFAC_F02_352/anna/models/Qwen2.5-Coder-3B-Instruct
    enable_gradient_checkpointing: True
  actor:
    ppo_mini_batch_size: 1
    optim:
      lr: 1e-6
    self_distillation:
      success_reward_threshold: 1.0
      include_environment_feedback: True
      environment_feedback_only_without_solution: True
      max_reprompt_len: 6144
      alpha: 1.0
      distillation_topk: 20
      teacher_update_rate: 0.01
  rollout:
    n: 8
    gpu_memory_utilization: 0.4

custom_reward_function:
  path: ${vars.dir}/verl/utils/reward_score/feedback/acsl.py
  name: compute_score_batch

reward_model:
  reward_manager: batch
  use_reward_loop: False

trainer:
  n_gpus_per_node: 4
  logger: [console, wandb]
  project_name: sdpo-acsl-verl
  total_training_steps: 145
  test_freq: 29
  val_before_train: True
  save_freq: 29
  max_actor_ckpt_to_keep: 3
  resume_mode: auto